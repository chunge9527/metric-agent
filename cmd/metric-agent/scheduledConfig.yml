# scheduledConfig.yaml - 定时任务配置
# 对应 model.ScheduleConfigList 结构体
# 每个节点本地配置文件，定义需要定时执行的 PromQL 查询任务
# 任务由 robfig/cron/v3 调度执行，支持标准 cron 表达式
#
# 每条配置项说明：
#   name        : 任务名称，必填且唯一
#   cron        : cron 表达式，必填；支持分/时/日/月/周
#   queryConfigs: PromQL 查询配置
#     queries   : 查询列表，按配置串行执行
#       queryKey: 查询结果标识键名
#       promql   : PromQL 查询语句
#   output      : 输出配置
#     path      : 结果输出文件路径，必填
#     maxFile   : 单文件最大上限（MB），超过则自动滚动
#   timeout     : 任务执行超时（秒），默认30秒

# 每分钟采集：节点CPU使用率
- name: cpu_usage
  cron: "* * * * *"
  timeout: 30
  queryConfigs:
    queries:
      - queryKey: process_cpu_seconds_total
        promql: process_cpu_seconds_total
      - queryKey: prometheus_http_requests_total
        promql: prometheus_http_requests_total
  output:
    path: ./data/metricas.json
    maxFile: 100
